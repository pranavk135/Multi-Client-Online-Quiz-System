<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizNet — Multi-Client Online Quiz</title>
    <meta name="description" content="A real-time multi-client online quiz system secured with SSL/TLS. Built with TCP sockets, WebSockets, and FastAPI.">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="card">

        <!-- ── Login Screen ── -->
        <div id="login-screen" class="screen active">
            <div class="brand">
                <div class="brand-icon"></div>
                <div class="brand-name">Quiz<span>Net</span></div>
            </div>
            <h1 class="screen-title">Join the Quiz</h1>
            <p class="screen-sub">Enter a username to connect to the live session.</p>

            <label class="label" for="username-input">Username</label>
            <input type="text" id="username-input" placeholder="e.g. Alice" autocomplete="off" maxlength="20">
            <button id="join-btn" class="btn-primary">Connect →</button>
            <p id="login-error" class="error-msg"></p>

            <div class="ssl-badge">SSL/TLS Encrypted</div>
        </div>

        <!-- ── Lobby Screen ── -->
        <div id="lobby-screen" class="screen">
            <div class="brand">
                <div class="brand-icon"></div>
                <div class="brand-name">Quiz<span>Net</span></div>
            </div>
            <h1 class="screen-title">Waiting Room</h1>
            <p class="screen-sub" id="lobby-sub">Waiting for all players to connect…</p>

            <label class="label">Connected Players</label>
            <div id="lobby-players" class="player-grid"></div>

            <div class="waiting-bar">
                <div class="waiting-bar-fill" id="lobby-bar" style="width: 0%"></div>
            </div>
            <p class="lobby-count" id="lobby-count">0 / 3</p>
        </div>

        <!-- ── Quiz Screen ── -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-counter" class="q-counter">Question 1 / 7</span>
                <span id="timer" class="timer-badge">10s</span>
            </div>

            <p id="question-text" class="question-text">Loading…</p>

            <div id="options-container" class="options-list"></div>

            <p id="ack-message" class="ack-msg"></p>
            <p id="quiz-message" class="info-msg"></p>
        </div>

        <!-- ── Leaderboard Screen ── -->
        <div id="leaderboard-screen" class="screen">
            <h1 class="screen-title">Leaderboard</h1>
            <p class="screen-sub" id="lb-result-msg"></p>
            <div id="leaderboard-list" class="lb-list"></div>
        </div>

        <!-- ── Game Over Screen ── -->
        <div id="game-over-screen" class="screen">
            <h1 class="screen-title">Quiz Over!</h1>
            <div class="winner-banner">
                <p class="winner-label">🏆 Winner</p>
                <p class="winner-name" id="winner-text">—</p>
            </div>
            <label class="label">Final Rankings</label>
            <div id="final-leaderboard" class="lb-list"></div>

            <div id="fairness-report" class="fairness-report"></div>

            <button class="btn-primary btn-danger" onclick="location.reload()">Play Again</button>
        </div>

    </div>

    <script src="/static/app.js"></script>
</body>
</html>
